name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sphere
          POSTGRES_PASSWORD: sphere
          POSTGRES_DB: sphere_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sphere -d sphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sphere:sphere@localhost:5432/sphere_test
      NODE_ENV: test
      CRON_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-thirty-two-characters
      OTP_HASH_SECRET: ci-only-otp-secret-that-is-at-least-thirty-two-characters
      TOKEN_HASH_SECRET: ci-only-token-secret-that-is-at-least-thirty-two-characters
      PRESCRIPTION_RETENTION_DAYS: "365"
      ORDER_RESERVATION_TTL_MINUTES: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Static checks must run even when a database migration is broken.
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npx prisma migrate deploy
      - run: npm test
      # Build still runs even if the separate dependency audit reports a vulnerability.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
