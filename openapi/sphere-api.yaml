        discountPct: { type: integer, minimum: 1, maximum: 90 }
        color: { type: [string, 'null'] }
        active: { type: boolean }
        isPublic: { type: boolean }
        startsAt: { type: [string, 'null'], description: Parsed as a Kenya-local day }
        endsAt: { type: [string, 'null'], description: Parsed as a Kenya-local day }
        maxUses: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        perUserLimit: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        perIpLimit: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        perBrowserLimit: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        minimumSpend: { type: [number, 'null'], minimum: 0, maximum: 10000000 }
    PromotionValidate:
      type: object
      required: [code, subtotal]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{3,32}$' }
        subtotal: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
    MedicineRequestCreate:
      type: object
      required: [medicineName, phone]
      properties:
        medicineName: { type: string, minLength: 2, maxLength: 200 }
        phone: { type: string, maxLength: 30, description: Digits, spaces and +() - characters; normalized to +254XXXXXXXXX }
        photo:
          type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            type: { type: string, enum: [image/jpeg, image/png, image/webp] }
            base64: { type: string, description: Max about 4MB encoded; 3MB decoded }
    StaffUpsert:
      type: object
      description: POST requires name, email, role and password; PATCH accepts partial fields
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, PHARMACIST, STAFF, RIDER] }
        password: { type: string, description: Policy 10-128 chars with at least one letter and one digit }
        phone: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        active: { type: boolean }
    BandaGoSyncRequest:
      type: object
      required: [items]
      properties:
        trigger: { type: string, enum: [EXTENSION_STREAM, BACKGROUND_POLL, CSV_IMPORT, MANUAL_RECONCILE], description: Defaults to EXTENSION_STREAM when invalid }
        items:
          type: array
          items:
            type: object
            required: [externalPosId, name]
