                type: array
                description: FEFO lots; expired batches never count as sellable stock
                items:
                  type: object
                  properties:
                    batchNumber: { type: string }
                    qtyOnHand: { type: number }
                    expiryDate: { type: [string, 'null'] }
                    externalBatchId: { type: [string, 'null'] }
    BandaGoCrmCustomer:
      type: object
