        channel: { type: string, description: Always IN_APP on the Notification row }
        event: { type: [string, 'null'] }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        metadata: { type: [string, 'null'] }
        staffId: { type: [string, 'null'] }
    NotificationPrefs:
      type: object
      description: Only email and push affect delivery; sms and whatsapp are stored but never dispatched
      properties:
        sms: { type: boolean }
        whatsapp: { type: boolean }
        email: { type: boolean }
        push: { type: boolean }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        actor: { type: string }
        actorRole: { type: [string, 'null'] }
        action: { type: string, description: 'e.g. ORDER_STATUS_PAID, PRODUCT_UPDATED, STAFF_CREATED' }
        entity: { type: string }
        entityId: { type: [string, 'null'] }
        details: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [name, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, description: Kenyan phone normalized to +254XXXXXXXXX }
        password: { type: string, minLength: 10, maxLength: 128, description: At least one letter and one digit }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Email or phone (case-insensitive) }
        password: { type: string }
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    ProfileUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        avatar: { type: [string, 'null'] }
        email: { type: string, format: email }
        phone: { type: string }
        currentPassword: { type: string, description: Required when newPassword is present }
        newPassword: { type: string }
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: Kenyan phone number }
    OtpVerify:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string, pattern: '^\d{6}$' }
    AddressCreate:
      type: object
      description: POST requires text; PATCH accepts partial fields
      properties:
        label: { type: string, maxLength: 80 }
        text: { type: string, minLength: 5, maxLength: 500 }
        area: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 500 }
        isDefault: { type: boolean }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    ProductUpsert:
      type: object
      description: POST requires name and price; PATCH accepts partial fields
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        price: { type: number, minimum: 0, maximum: 10000000 }
        compareAtPrice: { type: [number, 'null'], description: Must exceed price }
        sku: { type: string, pattern: '^[A-Z0-9._-]{3,64}$' }
        categoryId: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        packSize: { type: [string, 'null'] }
        stockQty: { type: integer, minimum: 0 }
        lowStockThreshold: { type: integer, minimum: 0 }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        requiresPrescription: { type: boolean }
        active: { type: boolean }
        description: { type: string, maxLength: 5000 }
        usageInfo: { type: [string, 'null'] }
        warnings: { type: [string, 'null'] }
        image: { type: [string, 'null'], description: Managed image (site /images path or R2 public URL) }
    ReviewCreate:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'], minLength: 3, maxLength: 500 }
    CreateOrderRequest:
      type: object
      required: [items, fulfillment, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [productId, qty]
            properties:
              productId: { type: string }
              qty: { type: integer, minimum: 1, maximum: 99 }
        fulfillment: { type: string, enum: [PICKUP, DELIVERY] }
        paymentMethod: { type: string, enum: [MPESA, CARD, CASH, LATER] }
        customer:
          type: object
          description: Guest contact details (ignored for signed-in customers)
          properties:
            name: { type: string, minLength: 2, maxLength: 100 }
            phone: { type: string, description: Kenyan phone }
            email: { type: [string, 'null'] }
        addressId: { type: string, description: Saved address for delivery orders }
        address: { type: [string, 'null'], description: Free-text delivery address }
        area: { type: [string, 'null'] }
        notes: { type: [string, 'null'], maxLength: 1000 }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        prescriptionIds: { type: array, items: { type: string }, description: Owned, unused prescriptions for Rx items }
        promotionCode: { type: [string, 'null'], description: Re-validated server-side under an advisory lock }
        redeemPoints: { type: [integer, 'null'], description: Sphere Points to redeem (capped at 25 percent) }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string, maxLength: 500 }
    MpesaInitiateRequest:
      type: object
      required: [orderId, phone, idempotencyKey]
      properties:
        orderId: { type: string }
        phone: { type: string, description: Kenyan phone number }
        idempotencyKey: { type: string, pattern: '^[a-zA-Z0-9_-]{16,100}$' }
        accessToken: { type: string, description: Alternative to the x-order-access-token header }
    IntaSendInitiateRequest:
      type: object
      required: [orderId, idempotencyKey]
      properties:
        orderId: { type: string }
        idempotencyKey: { type: string, pattern: '^[a-zA-Z0-9_-]{16,100}$' }
        mode: { type: string, enum: [checkout], description: Card details are entered only on the hosted checkout }
        accessToken: { type: string, description: Alternative to the x-order-access-token header }
    RefundRequest:
      type: object
      required: [paymentId, reason]
      properties:
        paymentId: { type: string }
        reason: { type: string, maxLength: 100 }
        details: { type: string, maxLength: 500 }
        cashConfirmed: { type: boolean, description: Required for CASH refunds }
        cashRefundReference: { type: string, pattern: '^[A-Za-z0-9_-]{6,100}$' }
    PrescriptionUploadRequest:
      type: object
      required: [fileName, fileType]
      properties:
        fileName: { type: string, maxLength: 120 }
        fileType: { type: string, enum: [png, jpeg, jpg, webp, heic, pdf] }
        storageKey: { type: string, description: R2-first path; verified against prefix, owner metadata and size }
        fileData: { type: string, description: base64 fallback (or data URL); magic-byte validated }
        notes: { type: [string, 'null'], maxLength: 1000 }
        orderId: { type: [string, 'null'], description: Optional attach to one of the customer's own orders }
    ReviewPrescriptionRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/RxStatus' }
        reviewNotes: { type: [string, 'null'], maxLength: 2000, description: Required unless APPROVED }
        refillsAllowed: { type: integer, minimum: 0, maximum: 6, description: Forced to 0 on refill dispense copies; cannot be less than refillsUsed on original prescriptions }
        validDays: { type: integer, enum: [30, 60, 90, 180], default: 90, description: Ignored on refill dispense copies (inherits parent validUntil) }
    RequestRefillRequest:
      type: object
      description: Optional overrides when requesting a refill; omitted fields inherit safely from the source prescription order.
      properties:
        fulfillment: { type: string, enum: [PICKUP, DELIVERY] }
        paymentMethod: { type: string, enum: [MPESA, CARD, CASH, LATER] }
        addressId: { type: string, description: Saved customer address id when fulfillment is DELIVERY }
        deliveryAddress: { type: string, maxLength: 300 }
        deliveryArea: { type: string, maxLength: 100 }
        deliveryNotes: { type: string, maxLength: 500 }
        deliveryLatitude: { type: number, minimum: -90, maximum: 90 }
        deliveryLongitude: { type: number, minimum: -180, maximum: 180 }
        notes: { type: string, maxLength: 600 }
    ServiceUpsert:
      type: object
      properties:
        name: { type: string }
        shortDescription: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        durationMinutes: { type: integer, minimum: 5, maximum: 480, default: 15 }
        price: { type: [number, 'null'], maximum: 10000000, description: Null means free or POA }
        heroImage: { type: [string, 'null'] }
        images: { type: array, maxItems: 10, items: { type: object, properties: { url: { type: string }, alt: { type: [string, 'null'] }, sortOrder: { type: integer } } } }
        featured: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
    ServiceBookingCreate:
      type: object
      required: [serviceId, start, end]
      properties:
        serviceId: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: Must equal start plus durationMinutes }
        expectedPrice: { type: [number, 'null'], description: Must equal the current price exactly (409 otherwise) }
        customerNotes: { type: [string, 'null'], maxLength: 1000 }
    BookingReview:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'], maxLength: 1000 }
    PromotionUpsert:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        badge: { type: [string, 'null'] }
