              price: { type: number, description: 'Parser strips currency text such as KSh 3,400' }
              costPrice: { type: [number, 'null'] }
              stock: { type: number }
              requiresPrescription: { type: [boolean, 'null'], description: Kenya PPB classification; never downgraded by sync }
              imageUrl: { type: [string, 'null'] }
              nearestExpiryDate: { type: [string, 'null'] }
              dosageForm: { type: [string, 'null'] }
              strength: { type: [string, 'null'] }
