            distanceBands: { type: array, items: { type: object, properties: { id: { type: string }, minKm: { type: number }, maxKm: { type: [number, 'null'] }, fee: { type: number }, label: { type: string } } } }
        compliance:
          type: object
          description: Redacted to empty strings below ADMIN/PHARMACIST
          properties:
            premiseLicenceNumber: { type: string }
            premiseLicenceExpiry: { type: string }
            superintendentName: { type: string }
            superintendentReg: { type: string }
            notes: { type: string }
    SettingsUpdate:
      type: object
      properties:
        pharmacy: { type: object, description: Partial pharmacy profile fields }
        delivery:
          type: object
          description: 'Full delivery block; distance pricing needs pharmacyLocation and at least one band'
          properties:
            mode: { type: string, enum: [flat, zone] }
            pricingMode: { type: string, enum: [zone, distance] }
            flatFee: { type: number, minimum: 0 }
            freeOver: { type: [number, 'null'] }
            nightDelivery: { type: boolean }
            zones: { type: array, maxItems: 50, items: { type: object, properties: { name: { type: string, maxLength: 100 }, fee: { type: number, minimum: 0 } } } }
            pharmacyLocation: { type: object, properties: { latitude: { type: number }, longitude: { type: number }, label: { type: string } } }
            distanceBands: { type: array, maxItems: 30, items: { type: object, properties: { id: { type: string }, minKm: { type: number }, maxKm: { type: [number, 'null'] }, fee: { type: number }, label: { type: string } } } }
        compliance:
          type: object
          description: Internal PPB record; audited and never published
          properties:
            premiseLicenceNumber: { type: string }
            premiseLicenceExpiry: { type: string }
            superintendentName: { type: string }
            superintendentReg: { type: string }
            notes: { type: string, maxLength: 1000 }
    AssistantChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          description: Conversation history; the server keeps the last 8 and truncates the final user message to 1800 characters
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 1800 }
    AssistantChatResponse:
      type: object
      properties:
        reply: { type: string, description: Brief markdown; credentials redacted; never claims completed actions }
        actions:
          type: array
          description: Client-side action cards; account and payment actions are executed client-side through authenticated endpoints
          items:
            type: object
            properties:
              type: { type: string, enum: [navigate, search, product, book, pay, appointments] }
              label: { type: string }
              view: { type: string, enum: [home, catalog, services, cart, checkout, orders, prescriptions, account, auth] }
              query: { type: string, maxLength: 100 }
              id: { type: string }
              price: { type: [number, 'null'] }
              packSize: { type: [string, 'null'] }
              stockStatus: { type: [string, 'null'] }
              requiresPrescription: { type: boolean }
              duration: { type: [integer, 'null'] }
        escalated: { type: boolean, description: True when a pharmacy team member is the right next step }
