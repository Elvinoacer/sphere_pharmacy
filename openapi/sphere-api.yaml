openapi: 3.1.0
info:
  title: Sphere Pharmacy API
  version: 0.3.0
  description: |
    REST API for Sphere Pharmacy, a full-stack retail pharmacy operations platform
    serving a community pharmacy in Roysambu, Nairobi, Kenya. Covers catalog and
    products, checkout and orders, M-Pesa Daraja and IntaSend card payments,
    prescription review and refills, clinical service bookings, promotions and
    Sphere Points loyalty, notifications, staff/admin operations, bi-directional
    BandaGo POS/CRM reconciliation & Daily Sales Export, documentation portal
    search/assistant APIs, and cron jobs.

    Authentication model:
    - Customer and staff sessions use the opaque sphere_session cookie
      (httpOnly, SameSite=Lax, secure in production). Customer sessions last 30
      days; staff sessions 7 days absolute with a 12-hour idle timeout.
    - Guests who place orders receive a one-time x-order-access-token header
      token (valid 7 days) for order tracking and payment initiation.
    - Cron endpoints require Authorization Bearer CRON_SECRET.
    - BandaGo integration accepts timing-safe fail-closed Authorization Bearer
      BANDAGO_SYNC_API_KEY or an ADMIN/PHARMACIST staff session (CRM GET adds STAFF).
    - Provider webhooks (M-Pesa, IntaSend, Resend) use their own signature or
      token verification and always re-verify state server-side.

    All monetary amounts are Kenyan Shillings (KES). Every error response is a
    single JSON object of shape { "error": "human-readable message" }. Sensitive
    endpoints send Cache-Control no-store. Payment initiation requires a client
    idempotencyKey matching ^[a-zA-Z0-9_-]{16,100}$. See docs/api/api-reference.md
    for the full human-readable contract.
servers:
  - url: /
tags:
  - name: Auth
    description: Customer and staff sign-in, sessions, OTP phone verification.
  - name: Addresses
    description: Customer saved delivery addresses.
  - name: Categories
    description: Public product categories.
  - name: Products
    description: Catalog, product CRUD, reviews, stock alerts, CSV import.
  - name: Orders
    description: Checkout, order lifecycle, dispatch, riders, loyalty summary.
  - name: Prescriptions
    description: Upload, pharmacist review, refills, presigned file access.
  - name: Payments
    description: M-Pesa STK push, IntaSend hosted checkout, webhooks, refunds.
  - name: Services
    description: Clinical care services, availability, slots, reviews.
  - name: ServiceBookings
    description: Customer bookings and service payments.
  - name: Promotions
    description: Promo codes and validation.
  - name: MedicineRequests
    description: Guest "find this medicine" requests.
  - name: Notifications
    description: In-app inbox, preferences, push tokens, email webhook, tests.
  - name: Admin
    description: Staff workspace - stats, audit, staff, reviews, bookings, health.
  - name: BandaGoIntegration
    description: BandaGo POS product/batch sync and CRM reconciliation.
  - name: Location
    description: OpenStreetMap Nominatim geocoding proxy.
  - name: Settings
    description: Pharmacy profile, delivery pricing, compliance record.
  - name: Upload
    description: R2 file uploads (direct multipart or presigned PUT).
  - name: Assistant
    description: Public AI assistant chat (Groq-backed, deterministic fallback).
  - name: Cron
    description: Scheduled jobs guarded by Bearer CRON_SECRET.

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account and open a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Customer session payload and session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Customer password sign-in (email or phone)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Customer session payload and session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/staff-login:
    post:
      tags: [Auth]
      summary: Staff password sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Staff session payload and session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Account is deactivated }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the session and deregister a push token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: Push token to deregister if owned by caller }
      responses:
        '200': { description: '{ ok: true }' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Session bootstrap (anonymous returns ok true and role null)
      responses:
        '200':
          description: Anonymous marker or session payload; no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
  /api/auth/profile:
    patch:
      tags: [Auth]
      summary: Update customer profile (name, avatar, email, phone, password)
      security: [{ sessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: Updated customer session payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/otp/request:
    post:
      tags: [Auth]
      summary: Send a 6-digit SMS OTP to a Kenyan phone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '200': { description: '{ sent: true }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an OTP, auto-create the account, claim guest orders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: Customer session payload (guest orders claimed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Code already used }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/addresses:
    get:
      tags: [Addresses]
      summary: List the customer's saved addresses (default first, cap 50)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: AddressDTO[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AddressDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Addresses]
      summary: Create a saved address
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '200':
          description: Created address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update an owned address
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Addresses]
      summary: Delete an owned address
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: '{ ok: true }' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/categories:
    get:
      tags: [Categories]
      summary: Active categories ordered by sortOrder with product counts
      responses:
        '200':
          description: CategoryDTO[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryDTO' }

  /api/products:
    get:
      tags: [Products]
      summary: Search, filter, sort and page the catalog
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Multi-term case-insensitive search }
        - { name: category, in: query, schema: { type: string }, description: Category id or slug }
        - { name: rx, in: query, schema: { type: string, enum: [any, 'yes', 'no'] } }
        - { name: availability, in: query, schema: { type: string, enum: [any, in, low, out] } }
        - { name: stockStatus, in: query, schema: { type: string }, description: Admin view only }
        - { name: sort, in: query, schema: { type: string, enum: [popular, price-asc, price-desc, name, name-desc, newest, oldest, stock-asc, stock-desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: ids, in: query, schema: { type: string }, description: Comma-separated product ids (max 50) }
        - { name: admin, in: query, schema: { type: string, enum: ['yes'] }, description: Pass yes to require a staff session and include inactive products }
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductsPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Products]
      summary: Create a product
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpsert' }
      responses:
        '200':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: SKU already exists }
  /api/products/{id}:
    get:
      tags: [Products]
      summary: Product detail (active only, with rating aggregates)
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDTO' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Update product fields, stock and flags
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpsert' }
      responses:
        '200':
          description: Updated product (back-in-stock and low-stock alerts may fire)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Delete product, or discontinue it when order history exists
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: '{ ok: true }' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/products/{id}/reviews:
    get:
      tags: [Products]
      summary: Published review summary, breakdown and own review
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Review summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Products]
      summary: Leave a review (requires a completed purchase)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No completed purchase for this product }
        '409': { description: Already reviewed }
  /api/products/{id}/stock-alert:
    post:
      tags: [Products]
      summary: Watch an out-of-stock product for restock
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201':
          description: Created or re-armed alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAlert' }
        '400': { description: Product is currently in stock }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already watching }
  /api/products/stock-alerts:
    get:
      tags: [Products]
      summary: The customer's watchlist
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: StockAlert[]
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Products]
      summary: Stop watching a product
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: Alert id }
      responses:
        '200': { description: '{ ok: true }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/products/bulk:
    post:
      tags: [Products]
      summary: CSV product import (header + up to 1000 rows, upsert by SKU)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: CSV text with name and price columns required }
      responses:
        '200': { description: '{ created, updated, errors[] }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /api/orders:
    get:
      tags: [Orders]
      summary: List orders by scope
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all, dispatch, dispatch-history, rider] }, description: 'Omitted scope lists the customer''s own orders' }
        - { name: status, in: query, schema: { type: string }, description: scope=all filter }
        - { name: type, in: query, schema: { type: string }, description: scope=all filter }
        - { name: search, in: query, schema: { type: string, maxLength: 80 }, description: Reference, contact, area or customer search }
        - { name: cursor, in: query, schema: { type: string }, description: Cursor pagination id for scope=all }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OrderDTO[] (private no-store)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      summary: Place an order (guest checkout supported, OTC only for guests)
      security: [{ sessionCookie: [] }, { guestOrderToken: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created order; guest responses include the one-time guestAccessToken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Prescription items require a verified account }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail for owner, staff, assigned rider or guest token
      security: [{ sessionCookie: [] }, { guestOrderToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Order with items, payments, prescriptions and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '401': { description: No session or access token }
        '403': { description: Signed in but not permitted for this order }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Orders]
      summary: Staff status transition with workflow guards
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusUpdate' }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Illegal transition or concurrent order change }
  /api/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an unpaid order and restore stock and points
      security: [{ sessionCookie: [] }, { guestOrderToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not cancellable or a captured payment exists }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/orders/{id}/assign:
    post:
      tags: [Orders]
      summary: Assign an active rider to a dispatch-ready delivery
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId]
              properties:
                riderId: { type: string }
      responses:
        '200':
          description: Order with rider assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not a dispatchable delivery or version conflict }
  /api/orders/{id}/prepare:
    post:
      tags: [Orders]
      summary: Accept the order and begin packing (moves to PREPARING)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Order now PREPARING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not eligible for preparation }
  /api/orders/{id}/cash-confirm:
    post:
      tags: [Orders]
      summary: Record cash received (creates a SUCCESS CASH payment)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Updated order with the cash payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Cash not allowed in this state or payment in flight }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/orders/{id}/request-payment:
    post:
      tags: [Orders]
      summary: Staff triggers an M-Pesa STK push to the customer's phone
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, description: Kenyan phone; defaults to order contact }
                idempotencyKey: { type: string, pattern: '^[a-zA-Z0-9_-]{16,100}$' }
      responses:
        '200': { description: '{ paymentId, checkoutRequestId, message }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/orders/loyalty:
    get:
      tags: [Orders]
      summary: Sphere Points balance, rules and per-order history
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Loyalty summary (lifetime figures over the most recent 30 active orders)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/orders/riders:
    get:
      tags: [Orders]
      summary: Active riders for assignment
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: StaffDTO[] of active RIDER staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/prescriptions:
    get:
      tags: [Prescriptions]
      summary: Own prescriptions, or the pharmacist queue with scope=queue
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [queue] }, description: 'queue requires PHARMACIST or ADMIN' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: PrescriptionDTO[] (no file URLs in lists)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrescriptionDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Prescriptions]
      summary: Register an uploaded prescription (R2 storageKey or base64)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescriptionUploadRequest' }
      responses:
        '201':
          description: Created prescription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/prescriptions/{id}:
    get:
      tags: [Prescriptions]
      summary: Prescription detail with a presigned file URL (access logged)
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: download, in: query, schema: { type: string, enum: ['1'] }, description: '1 triggers a 302 redirect with attachment disposition' }
      responses:
        '200':
          description: Prescription with short-lived presigned fileUrl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionDTO' }
        '302': { description: Redirect to the presigned download (download=1) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Presign failure }
    patch:
      tags: [Prescriptions]
      summary: Pharmacist review decision (aggregates to the linked order; refill copies cannot spawn new refills)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewPrescriptionRequest' }
      responses:
        '200':
          description: Reviewed prescription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionDTO' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Linked order is cancelled/refunded, parent prescription expired, or order version conflict }
    delete:
      tags: [Prescriptions]
      summary: Soft delete (order-linked prescriptions require ADMIN)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: '{ ok: true }' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Linked to an order (non-admin) }
  /api/prescriptions/{id}/refill:
    post:
